openapi: 3.0.3
info:
  title: Claw Wallet Sandbox HTTP API
  description: |
    Local sandbox process exposing wallet lifecycle, signing, transfer, swap, policy, audit, and RPC-proxy endpoints.

    **Authentication:** When `AGENT_TOKEN` is set in the environment, most routes require:
    `Authorization: Bearer <AGENT_TOKEN>`. If `AGENT_TOKEN` is empty, protected routes are allowed in local dev mode.

    **Try it out:** Click **Authorize**, enter the same bearer token as `.env.clay`, then execute operations.

    **Reality check:** this spec mirrors the current sandbox implementation and documents a mix of MVP, gray-release, and legacy bootstrap paths.
  version: "1.1.0"

servers:
  - url: /
    description: Current sandbox origin

tags:
  - name: Health
    description: Liveness and bootstrap health.
  - name: Wallet
    description: Wallet creation, binding, unlock, status, assets, and history.
  - name: Transactions
    description: Sign, broadcast, and transfer flows.
  - name: EVM
    description: Managed EVM contract invocation helpers.
  - name: Sui
    description: Sui transaction bytes and option-driven helpers.
  - name: Swap
    description: DEX swap helpers.
  - name: Skills
    description: SafuSkill discovery, preload, and local read helpers.
  - name: Sandbox
    description: Prices, risk cache, audit logs, and shutdown.
  - name: Control
    description: Legacy local control endpoints used by installer/bootstrap flows.
  - name: RPC
    description: Upstream JSON-RPC proxy per chain.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Value of AGENT_TOKEN from sandbox environment (same as CLAY_AGENT_TOKEN in client .env).

  schemas:
    ErrorText:
      type: string
      description: Plain-text error body from http.Error
    StatusMessage:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
    AddressNote:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
        chain:
          type: string
          description: Optional chain scope for whitelist or blacklist entries.
        note:
          type: string
      required: [address]
    Policy:
      type: object
      additionalProperties: true
      properties:
        max_amount_per_tx_usd:
          type: number
        daily_limit_usd:
          type: number
        whitelist_to:
          type: array
          items:
            $ref: "#/components/schemas/AddressNote"
        blacklist_to:
          type: array
          items:
            $ref: "#/components/schemas/AddressNote"
        pin_ttl_seconds:
          type: integer
          format: int64
        daily_max_tx_count:
          type: integer
        unpriced_asset_policy:
          type: string
          enum: [allow, block]
        block_high_risk_tokens:
          type: boolean
        allow_blind_sign:
          type: boolean
        strict_plain_text:
          type: boolean
        keep_share2_resident:
          type: boolean
        personal_sign_keyword_blacklist:
          type: array
          items:
            type: string
    LocalPolicyUpdateRequest:
      type: object
      additionalProperties: false
      description: Partial local policy update payload. Unspecified fields remain unchanged.
      properties:
        max_amount_per_tx_usd:
          type: number
          minimum: 0
          maximum: 1000
        daily_limit_usd:
          type: number
          minimum: 0
          maximum: 10000
        daily_max_tx_count:
          type: integer
          minimum: 0
          maximum: 100
        whitelist_to:
          type: array
          items:
            $ref: "#/components/schemas/AddressNote"
        unpriced_asset_policy:
          type: string
          enum: [allow, block]
        allow_blind_sign:
          type: boolean
        strict_plain_text:
          type: boolean
    LocalPolicyUpdateResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          example: policy_updated
        policy:
          $ref: "#/components/schemas/Policy"
      required: [status, policy]
    UsageSnapshot:
      type: object
      additionalProperties: false
      properties:
        local_spent_wei:
          type: string
        local_spent_usd:
          type: number
        local_tx_count:
          type: integer
        onchain_spent_usd:
          type: number
        onchain_tx_count:
          type: integer
        effective_spent_usd:
          type: number
        effective_tx_count:
          type: integer
    PriceCacheResponse:
      type: object
      additionalProperties: true
      properties:
        prices:
          type: object
          additionalProperties: true
    SecurityCacheResponse:
      type: object
      additionalProperties: true
      properties:
        security:
          type: object
          additionalProperties: true
    AuditLogEntry:
      type: object
      additionalProperties: true
    WalletHistoryEntry:
      type: object
      additionalProperties: true
    EncryptedShare:
      type: object
      additionalProperties: false
      properties:
        cipher: { type: string }
        iv: { type: string }
        salt: { type: string }
    WalletStatusResponse:
      type: object
      description: |
        Snapshot from `handleStatus`. This mirrors the live sandbox response and may include
        extra implementation-specific fields in addition to the documented ones.
      additionalProperties: true
      properties:
        uid: { type: string }
        address: { type: string }
        addresses: { type: object, additionalProperties: { type: string } }
        address_explorers: { type: object, additionalProperties: { type: string } }
        master_pub_key: { type: string }
        status:
          type: string
          enum:
            - inactive
            - identity_set_waiting_for_activation
            - provisioned_waiting_for_pin
            - ready
        locked_reason:
          type: string
          enum:
            - waiting_for_activation
            - waiting_for_pin
            - ttl_expired
            - activation_failed
            - reactivation_failed
        has_provisioned_share1: { type: boolean }
        today_spent_wei: { type: string }
        today_spent_usd: { type: number }
        today_tx_count: { type: integer }
        today_local_spent_wei: { type: string }
        today_local_spent_usd: { type: number }
        today_local_tx_count: { type: integer }
        today_onchain_spent_usd: { type: number }
        today_onchain_tx_count: { type: integer }
        today_effective_spent_usd: { type: number }
        today_effective_tx_count: { type: integer }
        oracle_healthy: { type: boolean }
        oracle_native: { type: boolean }
        oracle_tokens: { type: boolean }
        pin_residency_expires_at:
          type: string
          format: date-time
        policy:
          $ref: "#/components/schemas/Policy"
    WalletInitRequest:
      type: object
      properties:
        master_pin:
          type: string
          description: Optional internal PIN used to seed the local wallet during bootstrap.
    WalletInitResponse:
      type: object
      additionalProperties: true
      properties:
        address: { type: string }
        addresses: { type: object, additionalProperties: { type: string } }
        uid: { type: string }
        status: { type: string }
        existing_identity: { type: boolean }
        locked_reason: { type: string }
    WalletUnlockRequest:
      type: object
      required: [pin]
      properties:
        pin: { type: string }
    WalletBindUIDRequest:
      type: object
      required: [uid]
      properties:
        uid: { type: string }
    WalletBindRequest:
      type: object
      required: [message_hash_hex]
      properties:
        message_hash_hex:
          type: string
          description: 32-byte message hash in hex form.
    WalletImportRequest:
      type: object
      required: [uid, master_pub_key, enc_share3]
      properties:
        uid: { type: string }
        master_pub_key: { type: string }
        addresses: { type: object, additionalProperties: { type: string } }
        enc_share3: { $ref: "#/components/schemas/EncryptedShare" }
    WalletProvisionRequest:
      type: object
      required: [uid, otp]
      properties:
        uid: { type: string }
        otp: { type: string }
    ZeroGBackupRequest:
      type: object
      additionalProperties: false
      description: Optional network overrides for the sandbox 0G recovery backup flow.
      properties:
        rpc_url:
          type: string
          description: 0G EVM RPC URL used for both Storage payment and RecoveryVault registration.
          example: "https://evmrpc-testnet.0g.ai"
        indexer_url:
          type: string
          description: 0G Storage indexer URL used by the 0G Storage SDK uploader.
          example: "https://indexer-storage-testnet-turbo.0g.ai"
        vault_address:
          type: string
          description: RecoveryVault contract address on the selected 0G network.
          example: "0x254bfe1433C4C10d05cD37B6eF3F062323FC6be5"
    ZeroGBackupShare:
      type: object
      additionalProperties: false
      properties:
        receipt_hex:
          type: string
          description: Deterministic receipt hash registered in RecoveryVault.
        root_hash:
          type: string
          description: 0G Storage root returned by the upload.
        tx_hash:
          type: string
          description: 0G Storage upload transaction hash when returned by the SDK.
        commitment_hex:
          type: string
          description: Keccak256 commitment over the uploaded encrypted share blob.
      required: [receipt_hex, root_hash, tx_hash, commitment_hex]
    ZeroGBackupResponse:
      type: object
      additionalProperties: false
      properties:
        uid_hash_hex:
          type: string
        epoch:
          type: integer
          format: int64
        vault_address:
          type: string
        vault_tx_hash:
          type: string
        share2:
          $ref: "#/components/schemas/ZeroGBackupShare"
        share3:
          $ref: "#/components/schemas/ZeroGBackupShare"
      required: [uid_hash_hex, epoch, vault_address, vault_tx_hash, share2, share3]
    SignRequest:
      type: object
      description: |
        Supported sign modes: `transaction`, `personal_sign`, `typed_data`, `raw_hash`.

        Supported chains include the EVM set (`ethereum`, `0g`, `base`, `bsc`, `arbitrum`, `optimism`, `polygon`, `avalanche`, `linea`, `zksync`, `monad`)
        plus `solana`, `sui`, `aptos`, `ton`, and `bitcoin` depending on the flow.
      required: [chain, sign_mode, uid]
      properties:
        chain:
          type: string
        sign_mode:
          type: string
          enum: [transaction, personal_sign, typed_data, raw_hash]
        derivation_path: { type: string }
        builder_kind:
          type: string
          description: Structured builder shortcut, e.g. `native_transfer`, `erc20_transfer`, `sol_transfer`, `spl_transfer`, `sui_transfer`.
        to: { type: string }
        token_contract: { type: string }
        amount_wei: { type: string }
        data: { type: string }
        uid: { type: string }
        confirmed_by_user: { type: boolean }
        enc_share1: { $ref: "#/components/schemas/EncryptedShare" }
        wrapped_share2_hex: { type: string }
        share2_nonce_hex: { type: string }
        tx_payload_hex: { type: string }
        typed_data: { description: EIP-712 or chain-specific typed data }
    SignResult:
      type: object
      properties:
        signature_hex: { type: string }
        from: { type: string }
        tx_payload_hex: { type: string }
        raw_tx_hex: { type: string }
        builder_kind: { type: string }
    BroadcastRequest:
      type: object
      required: [chain]
      properties:
        chain: { type: string }
        uid: { type: string }
        raw_tx_hex: { type: string }
        raw_tx_base64: { type: string }
        tx_bytes_hex: { type: string }
        tx_bytes_base64: { type: string }
        signature: { type: string }
        signatures:
          type: array
          items: { type: string }
        options: { type: object }
    BroadcastResponse:
      type: object
      properties:
        chain: { type: string }
        submitted_id: { type: string }
        tx_hash: { type: string }
        signature: { type: string }
        digest: { type: string }
    TransferRequest:
      type: object
      required: [chain, to, amount_wei]
      properties:
        chain: { type: string }
        uid: { type: string }
        to: { type: string }
        amount_wei: { type: string }
        token_contract: { type: string }
        sui_gas_budget: { type: string }
    ManagedEVMInvokeRequest:
      type: object
      properties:
        uid: { type: string }
        chain: { type: string, description: Defaults to bsc if omitted }
        to: { type: string }
        value: { type: string, description: Wei as decimal string }
        data: { type: string, description: Calldata hex }
        confirmed_by_user: { type: boolean }
    UniswapSwapTradeAPIRequest:
      type: object
      additionalProperties: false
      description: |
        Uniswap swap request routed via Uniswap Trade API (api-key).

        Supported `chain` values:
        - ethereum, optimism, bsc, polygon, monad, base, arbitrum, avalanche, zksync, linea
      properties:
        chain:
          type: string
          description: Target EVM chain. Must be one of ethereum/optimism/bsc/polygon/monad/base/arbitrum/avalanche/zksync/linea.
          enum: [ethereum, optimism, bsc, polygon, monad, base, arbitrum, avalanche, zksync, linea]
        uid: { type: string, description: Optional bound wallet UID (used for auditing / policy context). }
        token_in:
          type: string
          description: Input token contract address, or `native` (can be omitted to mean native).
        token_out:
          type: string
          description: Output token contract address, or `native`.
        recipient:
          type: string
          description: Recipient address; defaults to the wallet address when omitted.
        amount_in_wei:
          type: string
          description: Amount in (decimal string, smallest unit).
        routing_preference:
          type: string
          description: Routing preference hint (e.g. BEST_PRICE).
        protocols:
          type: array
          items: { type: string }
          description: Optional protocol allowlist for routing (case-insensitive; e.g. V2, V3, UNISWAPX).
        urgency:
          type: string
          description: Optional urgency hint for routing (provider-specific).
        auto_slippage:
          type: string
          description: Optional auto slippage mode (e.g. DEFAULT/AUTO).
        slippage_tolerance:
          type: integer
          format: int64
          description: Optional slippage tolerance in basis points (bps). When set, overrides auto slippage.
        permit_amount:
          type: string
          description: Permit2 allowance amount setting (provider-specific; e.g. FULL).
      required: [chain, token_out, amount_in_wei]
    UniswapSwapTradeAPIResponse:
      type: object
      additionalProperties: false
      description: |
        Uniswap Trade API swap result.

        This API may execute:
        - an ERC20 approval reset (if required by the token),
        - an ERC20 approval (typically to Permit2),
        - then either submit a swap tx, or place an order (UniswapX / order routing).
      properties:
        chain: { type: string }
        from: { type: string }
        router_kind: { type: string, enum: [trade_api] }
        router: { type: string, description: Swap target contract address (when a swap tx is submitted). }
        request_id: { type: string }
        routing: { type: string, description: Routing method returned by provider (e.g. CLASSIC, DUTCH, UNISWAPX). }
        token_in: { type: string }
        token_out: { type: string }
        recipient: { type: string }
        amount_in_wei: { type: string }
        approval_required: { type: boolean }
        approval_reset_submitted_id: { type: string }
        approval_reset_tx_hash: { type: string }
        approval_submitted_id: { type: string }
        approval_tx_hash: { type: string }
        order_id: { type: string }
        order_status: { type: string }
        swap_submitted_id: { type: string }
        swap_tx_hash: { type: string }
      required:
        - chain
        - from
        - router_kind
        - token_in
        - token_out
        - recipient
        - amount_in_wei
        - approval_required
        - swap_submitted_id
    JupiterSwapRequest:
      type: object
      additionalProperties: false
      description: |
        Managed Jupiter swap (Solana only).

        Notes:
        - `chain` defaults to `solana` if omitted.
        - `token_in` can be omitted or set to `native` (SOL).
        - `token_out` can be set to `native` (SOL).
        - `slippage_bps` defaults to `50` when omitted/0.
        - `wrap_and_unwrap_sol`, `use_shared_accounts`, `dynamic_compute_unit_limit` default to `true` when omitted.
      properties:
        chain:
          type: string
          description: Must be `solana` (defaults to solana if omitted).
        uid: { type: string, description: Optional bound wallet UID (used for auditing / policy context). }
        token_in:
          type: string
          description: Token symbol or mint, or `native` (SOL).
        token_out:
          type: string
          description: Token symbol or mint, or `native` (SOL).
        amount_in_wei:
          type: string
          description: Amount in (decimal string, smallest unit). Must fit uint64 for Solana.
        slippage_bps:
          type: integer
          format: int64
          description: Slippage in basis points; defaults to 50.
        as_legacy_transaction:
          type: boolean
          description: Request legacy transaction instead of versioned transaction when possible.
        wrap_and_unwrap_sol:
          type: boolean
          description: Whether to wrap/unwrap SOL (defaults true).
        use_shared_accounts:
          type: boolean
          description: Whether to use shared accounts (defaults true).
        dynamic_compute_unit_limit:
          type: boolean
          description: Whether to enable dynamic compute unit limit (defaults true).
      required: [token_out, amount_in_wei]
    JupiterSwapResponse:
      type: object
      additionalProperties: false
      description: |
        Jupiter swap execution result. The sandbox fetches a quote, builds a swap transaction, signs it, and broadcasts it.
      properties:
        chain: { type: string, enum: [solana] }
        from: { type: string }
        token_in: { type: string }
        token_out: { type: string }
        amount_in_wei: { type: string }
        slippage_bps: { type: integer, format: int64 }
        in_amount: { type: string }
        out_amount: { type: string }
        other_amount_threshold: { type: string }
        swap_mode: { type: string }
        as_legacy_transaction: { type: boolean }
        used_versioned_tx: { type: boolean }
        jupiter_program: { type: string, description: The Jupiter program ID used by the built transaction. }
        swap_tx_base64: { type: string, description: Signed swap transaction base64 (ready to submit). }
        message_hex: { type: string, description: Message bytes hex with 0x prefix. }
        submitted_id: { type: string }
        signature: { type: string }
        last_valid_block_height: { type: integer, format: int64 }
      required:
        - chain
        - from
        - token_in
        - token_out
        - amount_in_wei
        - slippage_bps
        - as_legacy_transaction
        - used_versioned_tx
        - jupiter_program
    HaedalTxBytesExecuteRequest:
      type: object
      properties:
        uid: { type: string }
        txBytes: { type: string }
        tx_bytes_base64: { type: string }
        tx_bytes_hex: { type: string }
    HaedalOptionedRequest:
      type: object
      properties:
        uid: { type: string }
        option: { type: string, description: Haedal/Cetus skill option key }
        defi: { type: string }
        body: { type: object, additionalProperties: true }

    SafuSkillPreloadItem:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          description: Cache state for this item, such as `cached`, `downloaded`, or `already_initialized`.
        local_path: { type: string }
    SafuSkillPreloadResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          example: ok
        preloaded_count:
          type: integer
          format: int64
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SafuSkillPreloadItem"
      required: [status, preloaded_count, skills]
    SafuSkillResolveResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          example: ok
        source:
          type: string
          description: Where the result came from, such as `safuskill` or `local_cache_stale`.
        name: { type: string }
        id: { type: string }
        installed: { type: boolean }
        local_path: { type: string }
        metadata_path: { type: string }
        reload_needed: { type: boolean }
        update_error: { type: string }
    SafuSkillReadResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          example: ok
        name: { type: string }
        local_path: { type: string }
        content:
          type: string
          description: Raw SKILL.md content loaded from the local sandbox cache.
      required: [status, name, local_path, content]

    LifiBridgeRequest:
      type: object
      description: |
        **AGENT INSTRUCTION:**
        1. Before calling the bridge execution API, you MUST call the bridge quote API.
        2. Before calling the bridge quote API, you MUST call the bridge supported tokens API (`/api/v1/tx/bridge/lifi/tokens?chains={chainID}`).
        3. If the source chain is EVM and the target chain is Sui, you MUST ask the user if they want to route via Solana (`via_solana`). Explain that EVM -> Sui directly takes 15 minutes, while EVM -> Solana -> Sui takes only 2 minutes. Do NOT ask this if it's not EVM -> Sui.
      properties:
        via_solana:
          type: boolean
          description: "Whether to route through Solana when bridging from EVM to Sui. Only applicable for EVM to Sui routes."
        from_chain_id:
          type: string
          description: "Source Chain ID (LI.FI standard ID). Common IDs: ETH: '1', BSC: '56', Base: '8453', Arbitrum: '42161', Optimism: '10', Polygon: '137', Solana: '1151111081099710', Sui: '9270000000000000', Bitcoin: '20000000000001'. For more, see https://docs.li.fi/introduction/chains"
        from_address: { type: string, description: "Source wallet address" }
        from_token:
          type: string
          description: |
            Source Token address or symbol.
            **AGENT INSTRUCTION:** For tokens with multiple issuers (like USDT/USDC), ALWAYS prefer using the exact contract address instead of just the symbol. Before requesting a quote or executing a bridge, you MUST call `/api/v1/tx/bridge/lifi/tokens?chains={chainID}` to verify if the specific token address or symbol is supported on that chain. If a bridge quote or execution fails, verify the token support again.
        amount: { type: string, description: "Transaction amount (in smallest unit)" }
        to_chain_id:
          type: string
          description: "Target Chain ID (LI.FI standard ID). Common IDs are same as from_chain_id."
        to_address: { type: string, description: "Target wallet address" }
        to_token:
          type: string
          description: |
            Target Token address or symbol.
            **AGENT INSTRUCTION:** Similarly, MUST call `/api/v1/tx/bridge/lifi/tokens?chains={chainID}` to verify if the specific token is supported on the target chain.
        slippage: { type: number, description: "Slippage tolerance (optional, default 0.005)" }
      required: [from_chain_id, from_address, from_token, amount, to_chain_id, to_address, to_token]
    LifiRouteStep:
      type: object
      properties:
        tool: { type: string }
        from_token: { type: string }
        to_token: { type: string }
        estimated_time: { type: integer, description: "Estimated time for this step in seconds" }
    LifiQuoteResponse:
      type: object
      properties:
        is_success: { type: boolean }
        reason: { type: string }
        tool: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/LifiRouteStep" }
        estimated_duration: { type: integer, description: "Total estimated duration in seconds" }
        amount_in: { type: string, description: "Human-readable input amount formatted by token decimals" }
        amount_out: { type: string, description: "Human-readable output amount formatted by token decimals" }
        amount_in_raw: { type: string, description: "Raw input amount in smallest unit" }
        amount_out_raw: { type: string, description: "Raw output amount in smallest unit" }
        amount_in_symbol: { type: string, description: "Input token symbol" }
        amount_out_symbol: { type: string, description: "Output token symbol" }
        amount_in_decimals: { type: integer, description: "Input token decimals" }
        amount_out_decimals: { type: integer, description: "Output token decimals" }
    LifiExecuteStep:
      type: object
      properties:
        from_chain_id: { type: string }
        to_chain_id: { type: string }
        tx_hash: { type: string }
        status: { type: string }
        status_url: { type: string }
    LifiBridgeResponse:
      type: object
      properties:
        uid: { type: string }
        success: { type: boolean }
        status: { type: string, description: "PENDING, DONE, FAILED" }
        message: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/LifiExecuteStep" }
        final_tx_hash: { type: string }
        final_status_url: { type: string }
    LifiStatusRequest:
      type: object
      required: [uid]
      properties:
        uid: { type: string }
    LifiStatusResponse:
      type: object
      properties:
        status: { type: string, description: "PENDING, DONE, FAILED, NOT_FOUND" }
        message: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/LifiExecuteStep" }
        final_tx_hash: { type: string }
        final_status_url: { type: string }

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe
