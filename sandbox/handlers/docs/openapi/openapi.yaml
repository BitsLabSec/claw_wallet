  /api/v1/policy/local:
    get:
      tags: [Wallet]
      summary: Read-only local policy file (policy.json)
      description: |
        Returns the raw JSON from the on-disk `policy.json`. **GET only** - there is no POST/PUT on this path.

        To change limits or rules, use the **bound-user app** after binding, or rely on **relay-driven policy sync** that rewrites the file. A merged policy object is also included in `GET /api/v1/wallet/status`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Policy JSON (same shape as components/schemas/Policy when valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: policy.json not found on disk
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "405":
          description: Method not allowed (only GET is supported)
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/policy/update:
    post:
      tags: [Wallet]
      summary: Update selected local policy fields
      description: |
        Applies a partial update to the local policy, preserving all unspecified fields.

        Current limits enforced by the sandbox:
        - `max_amount_per_tx_usd`: 0 to 1000
        - `daily_limit_usd`: 0 to 10000
        - `daily_max_tx_count`: 0 to 100
        - `unpriced_asset_policy`: `allow` or `block`

        The updated policy is persisted to the encrypted on-disk policy store and then reloaded into the runtime engine.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPolicyUpdateRequest"
            examples:
              updateLimits:
                summary: Update limits and signing controls
                value:
                  max_amount_per_tx_usd: 1000
                  daily_limit_usd: 8000
                  daily_max_tx_count: 80
                  whitelist_to:
                    - address: "0xabc"
                      chain: "ethereum"
                      note: "friend"
                  unpriced_asset_policy: allow
                  allow_blind_sign: true
                  strict_plain_text: false
      responses:
        "200":
          description: Policy updated and reloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPolicyUpdateResponse"
        "400":
          description: Invalid payload or limit violation
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "500":
          description: Policy engine not initialized or policy persistence failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
    put:
      tags: [Wallet]
      summary: Update selected local policy fields
      description: Same behavior as `POST /api/v1/policy/update`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPolicyUpdateRequest"
      responses:
        "200":
          description: Policy updated and reloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPolicyUpdateResponse"
        "400":
          description: Invalid payload or limit violation
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "500":
          description: Policy engine not initialized or policy persistence failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/skills/safuskill/preload:
    post:
      tags: [Skills]
      summary: Preload the default SafuSkill set
      description: |
        Downloads and caches the default `BNBChain Skills` subset from `safuskill.ai` into the local sandbox skill cache.
        Already-installed entries are reported as `cached`; first-time downloads are reported as `downloaded`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafuSkillPreloadResponse"
        "502":
          description: SafuSkill upstream fetch or cache write failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/skills/by-name:
    get:
      tags: [Skills]
      summary: Search SafuSkill by name and cache it locally
      description: |
        Searches `safuskill.ai` for the requested skill name, fetches the matching skill detail, and writes
        `SKILL.md` plus metadata under the sandbox skill cache directory.

        If the skill is not found upstream but a local cached copy already exists, the handler returns a
        `local_cache_stale` response that points at the existing local file.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          description: Skill name to search for.
      responses:
        "200":
          description: Skill resolved and cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafuSkillResolveResponse"
              examples:
                freshInstall:
                  summary: Upstream search succeeded and the skill was cached locally
                  value:
                    status: ok
                    source: safuskill
                    name: Example Skill
                    id: skill_123
                    installed: true
                    local_path: sandbox_skill/example-skill/SKILL.md
                    metadata_path: sandbox_skill/example-skill/metadata.json
                    reload_needed: true
                staleLocalCopy:
                  summary: Upstream search failed but a local cached copy exists
                  value:
                    status: ok
                    source: local_cache_stale
                    name: Example Skill
                    installed: true
                    local_path: sandbox_skill/example-skill/SKILL.md
                    reload_needed: true
                    update_error: skill "Example Skill" not found on SafuSkill
        "400":
          description: Missing `name` query parameter
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "404":
          description: Skill not found on SafuSkill and no local cached copy exists
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "502":
          description: SafuSkill upstream fetch or cache write failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/skills/read:
    get:
      tags: [Skills]
      summary: Read a cached local SafuSkill
      description: Returns the `SKILL.md` content for a skill that was previously installed into the local sandbox cache.
      security:
        - bearerAuth: []
      parameters:
        - in: query
