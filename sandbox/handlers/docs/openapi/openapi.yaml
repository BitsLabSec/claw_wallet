  /api/v1/wallet/backup/0g:
    post:
      tags: [Wallet]
      summary: Upload encrypted recovery shares to 0G Storage and register RecoveryVault receipts
      description: |
        Sandbox-only disaster recovery backup flow for locally initialized wallets.

        The sandbox encrypts the current `share2` and `share3` backup blobs with the in-memory SEK,
        uploads both blobs to 0G Storage, derives deterministic receipts from `uidHash`, share kind,
        0G Storage root, and blob commitment, then submits a single `registerBackup` transaction to
        the configured RecoveryVault contract.

        This endpoint requires the wallet's local share state to still be available. If share2 or SEK
        has been wiped by TTL, policy, restart, or manual wipe, the endpoint returns 409 and should be
        retried after the wallet is reactivated with local share material available.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZeroGBackupRequest"
            examples:
              testnet:
                summary: 0G Galileo testnet
                value:
                  rpc_url: "https://evmrpc-testnet.0g.ai"
                  indexer_url: "https://indexer-storage-testnet-turbo.0g.ai"
                  vault_address: "0x254bfe1433C4C10d05cD37B6eF3F062323FC6be5"
              mainnet:
                summary: 0G mainnet RecoveryVault
                value:
                  rpc_url: "https://evmrpc.0g.ai"
                  indexer_url: "https://indexer-storage-turbo.0g.ai"
                  vault_address: "0xa8DF92c6724Db748B82d90f50b4b1e1542175440"
      responses:
        "200":
          description: Shares uploaded and receipts registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZeroGBackupResponse"
        "400":
          description: Invalid JSON body
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "409":
          description: Required local wallet state is unavailable
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "500":
          description: 0G Storage upload, RecoveryVault registration, or configuration failure
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/wallet/init:
