              schema: { $ref: "#/components/schemas/ErrorText" }
  /api/v1/tx/sign:
    post:
      tags: [Transactions]
      summary: Sign a transaction or message
      description: |
        Policy-gated sign entry point.

        Behavior summary:
        - checks wallet activation and PIN TTL
        - applies chain allowlist, spend limits, risk controls, and blind-sign rules
        - may fetch share2 from the relay if it is not already available locally
        - for structured EVM builders, `tx_payload_hex` can be omitted and derived from the builder fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignRequest" }
            examples:
              evmNativeTransfer:
                summary: EVM native transfer
                value:
                  chain: ethereum
                  sign_mode: transaction
                  uid: uid_123
                  builder_kind: native_transfer
                  to: "0x2222222222222222222222222222222222222222"
                  amount_wei: "1000000000000000"
                  data: "0x"
                  confirmed_by_user: true
              personalSign:
                summary: Personal sign
                value:
                  chain: solana
                  sign_mode: personal_sign
                  uid: uid_123
                  tx_payload_hex: "0x48656c6c6f"
                  data: "0x"
                  amount_wei: "0"
                  confirmed_by_user: true
      responses:
        "200":
          description: Signature result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignResult" }
        "400":
          description: Invalid payload or unsupported structured builder
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "401":
          description: Wallet locked or not activated
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "403":
          description: Policy or risk control rejection
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "502":
          description: Share2 recovery or relay failure
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/tx/broadcast:
