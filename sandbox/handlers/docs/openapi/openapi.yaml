          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /wipe:
    post:
      tags: [Control]
      summary: Clear in-memory session (policy wipe)
      responses:
        "200":
          description: Memory wiped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: memory_wiped

  /reset:
    post:
      tags: [Control]
      summary: Hard reset local sandbox identity state
      responses:
        "200":
          description: Reset acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: hard_reset_complete

  /api/rpc/{chain}:
    post:
      tags: [RPC]
      summary: JSON-RPC proxy to the configured chain endpoint
      description: |
        Forwards the request body to the upstream RPC endpoint for the requested chain.
        The sandbox returns the upstream response status and body.
      parameters:
        - name: chain
          in: path
          required: true
          schema:
            type: string
            example: solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Standard JSON-RPC 2.0 request
              example:
                jsonrpc: "2.0"
                id: 1
                method: getHealth
      responses:
        "200":
          description: Upstream JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Unsupported chain or invalid request body
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "502":
          description: Upstream RPC error
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

security:
  - bearerAuth: []

