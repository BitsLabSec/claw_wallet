              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid payload
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/tx/sui/execute_option:
    post:
      tags: [Sui]
      summary: Proxy Haedal/Cetus skill option (defi + body)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HaedalOptionedRequest" }
      responses:
        "200":
          description: Skill-dependent JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/tx/swap/evm_uniswap:
    post:
      tags: [Swap]
      summary: Uniswap swap via Trade API (EVM, multi-chain)
      description: |
        Multi-chain Uniswap swap entry for **EVM chains** via Uniswap Trade API (requires API key).

        Supported EVM chains (by `chain`):
        - ethereum (1)
        - optimism (10)
        - bsc (56)
        - polygon (137)
        - monad (143)
        - base (8453)
        - arbitrum (42161)
        - avalanche (43114)
        - zksync (324)
        - linea (59144)

        Notes:
        - This endpoint uses Uniswap's hosted Trade API for routing (it does not build swap calldata locally).
        - `token_in` / `token_out` accept EVM token addresses, or `native` for the chain native asset.
        - If `recipient` is omitted, it defaults to the active wallet address.
        - `amount_in_wei` is required and must be a decimal string in smallest units.
        - Slippage / routing controls are optional (e.g. `routing_preference`, `protocols`, `urgency`, `auto_slippage`, `slippage_tolerance`, `permit_amount`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniswapSwapTradeAPIRequest" }
      responses:
        "200":
          description: Swap pipeline result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniswapSwapTradeAPIResponse" }
        "400":
          description: Invalid swap request or policy rejection
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "503":
          description: Asset refresh / oracle temporarily unavailable
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/tx/swap/solana-jup:
    post:
      tags: [Swap]
      summary: Jupiter swap on Solana
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JupiterSwapRequest" }
      responses:
        "200":
          description: Jupiter swap result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JupiterSwapResponse" }
        "400":
          description: Invalid swap request or policy rejection
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "503":
          description: Asset refresh / oracle temporarily unavailable
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/tx/swap/sui-cetus:
    post:
      tags: [Swap]
      summary: Cetus swap on Sui (WIP)
      description: Handler body not yet implemented; may return **200 with empty body** after POST.
      responses:
        "200":
          description: Placeholder response; often empty until implemented
        "405":
          description: Method not POST

  /api/v1/tx/bridge/lifi/quote:
    post:
      tags: [Swap]
      summary: LI.FI Cross-chain Quote Estimation
      description: Estimate cross-chain/swap between any chain and any token, returning estimated time, available routes, and estimated costs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifiBridgeRequest" }
      responses:
        "200":
          description: Estimation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifiQuoteResponse" }
        "400":
          description: Invalid request parameters
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "500":
          description: Internal or external API call error
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/tx/bridge/lifi/tokens:
    get:
      tags: [Swap]
      summary: LI.FI Supported Tokens
      description: |
        Query supported tokens for specific chains.
        **AGENT INSTRUCTION:** ALWAYS call this endpoint to verify token support before a bridge quote or execution. If cross-chain operations fail (especially for stablecoins like USDT), use this to find the exact supported contract address.
      parameters:
        - in: query
          name: chains
          required: true
          schema:
            type: string
          description: Comma-separated LI.FI chain IDs (e.g., "1,56,137")
      responses:
        "200":
          description: List of supported tokens
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/tx/bridge/lifi/execute:
    post:
      tags: [Swap]
      summary: LI.FI Cross-chain Execution
      description: Execute cross-chain transaction, sign and broadcast. Includes possible intermediate routes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifiBridgeRequest" }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifiBridgeResponse" }
        "400":
          description: Invalid request parameters
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "500":
          description: Transaction execution failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/tx/bridge/lifi/status:
    post:
      tags: [Swap]
      summary: LI.FI Cross-chain Status Query
      description: Poll for the latest status of an asynchronous cross-chain task by UID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifiStatusRequest" }
      responses:
        "200":
          description: Status result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifiStatusResponse" }
        "400":
          description: Missing or invalid parameters
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/sandbox/shutdown:
    post:
      tags: [Sandbox]
      summary: Graceful HTTP server shutdown
      responses:
        "200":
