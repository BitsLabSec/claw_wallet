      tags: [Wallet]
      summary: Create a local wallet or return the existing identity
      description: |
        Creates a new wallet via relay `/sss/setup`, persists identity only after relay setup succeeds,
        and activates the local signer when possible.

        The operation is idempotent: if the sandbox already has an identity, the existing wallet snapshot is returned.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletInitRequest"
            example:
              master_pin: "123456"
      responses:
        "200":
          description: Wallet created or existing identity returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInitResponse"
        "500":
          description: Wallet generation or persistence failure
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "502":
          description: Relay unavailable or setup failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /api/v1/wallet/unlock:
