  /api/v1/wallet/bind:
    post:
      tags: [Wallet]
      summary: Sign the bind challenge and forward it to the relay
      description: |
        The sandbox signs the 32-byte hash with the master key and forwards the signature to the relay `/wallets/bind`.
        The response body is passed through from the relay on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletBindRequest"
            example:
              message_hash_hex: "0x7b0c..."
      responses:
        "200":
          description: Relay bind response passthrough
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: Wallet not activated or no UID bound
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }
        "502":
          description: Relay bind failed
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

