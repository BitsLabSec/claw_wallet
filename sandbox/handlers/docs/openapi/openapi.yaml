  /initialize:
    post:
      tags: [Control]
      security: []
      summary: Legacy installer - set master_pub_key and addresses
      description: |
        Used by installer flows. Not wrapped by `auth()` in code and still safe on localhost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                master_pub_key: { type: string }
                addresses: { type: object, additionalProperties: { type: string } }
                uid: { type: string }
      responses:
        "200":
          description: Initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: initialized
        "403":
          description: Identity already set
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/ErrorText" }

  /challenge/sign:
    post:
      tags: [Control]
      security: []
      summary: Sign challenge with active signer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge: { type: string }
                share1: { $ref: "#/components/schemas/EncryptedShare" }
                share2: { $ref: "#/components/schemas/EncryptedShare" }
      responses:
        "200":
          description: Signature
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  signature:
                    type: string
        "401":
